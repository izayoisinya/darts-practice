<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Darts Data</title>

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0,
                maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <meta name="theme-color" content="#0f1115" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta name="apple-mobile-web-app-title" content="Darts Practice" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />

    <link rel="manifest" href="manifest.json" />

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/theme.css" />

    <link rel="stylesheet" href="css/layout/lay_menu.css" />
    <link rel="stylesheet" href="css/layout/lay_data.css" />

  </head>

  <body class="page-data" onload="initDataPage()">
    <header class="header">
      <!-- トップでは「‹ Menu」（メインメニューへ）、各画面では「‹ Top」（データのトップへ）。data_hub.js -->
      <button type="button" id="dataHubBack" class="header-back">‹ Menu</button>
      <h1>Data</h1>
      <!-- Stats で見るゲームの切り替え（data_01.js の initDataGameSwitch()。Stats の画面だけに出す） -->
      <div id="dataGameSwitch" class="data-game-switch" role="tablist" aria-label="ゲームの種類">
        <button type="button" data-game="countup">Count-Up</button>
        <button type="button" data-game="01">01</button>
        <button type="button" data-game="cricket">Cricket</button>
      </div>
      <!-- トップのときだけ出す全ゲームのまとめ（data_hub.js の renderDataHub()） -->
      <div id="dataHubHeaderStats" class="data-hub-header-stats" aria-label="まとめ"></div>
    </header>

<!-- データ画面のトップ：全ゲームのまとめ・History（記録）と Stats（分析）の選択・カレンダー（data_hub.js の renderDataHub()） -->
<div id="dataHub" class="data-hub"></div>

<main class="data-container">
  <!-- History（記録）：全ゲームの一覧。ゲームの種類で絞り込める（data_loader.js の setHistoryFilter()） -->
  <div id="rightPanel">
    <div id="historyFilter" class="history-filter" role="group" aria-label="ゲームの種類で絞り込む">
      <button type="button" data-filter="all" onclick="setHistoryFilter('all')">All</button>
      <button type="button" data-filter="countup" onclick="setHistoryFilter('countup')">Count-Up</button>
      <button type="button" data-filter="01" onclick="setHistoryFilter('01')">01</button>
      <button type="button" data-filter="cricket" onclick="setHistoryFilter('cricket')">Cricket</button>
    </div>
    <!-- 日別メモのタグで絞り込む（data_loader.js の renderDataTagFilterHtml()。トップのカレンダーと共通） -->
    <div id="historyTagFilter" class="history-tag-filter"></div>
    <section id="sessionsContainer"></section>
  </div>
  <!-- Stats（分析）：ヘッダーで選んだゲームの成績。Count-Up はヒートマップ・タグ別の散布図・期間の比較も続けて出す（data.js の renderStatsView()） -->
  <div id="leftPanel">
    <!-- 01 の Stats（data_01.js の renderZeroOneData()。01 を選んでいるときだけ出し、下のカウントアップの欄は隠す） -->
    <div id="zeroOneStatsPanel" class="zeroone-stats-panel"></div>
    <section id="statsSection" class="data-summary-section">
      <h3 class="data-section-title">Stats</h3>
      <div id="statsContainer"></div>
    </section>
    <section id="awardsSection" class="data-summary-section">
      <h3 class="data-section-title">Awards</h3>
      <div id="awardsContainer"></div>
    </section>
    <!-- Stats の各欄はカード（.data-summary-section）。横に広い画面では 2 列に並べ、グラフなど幅のいるものは .stats-wide で 1 行を使う -->
    <section id="gameChartSection" class="data-summary-section stats-wide">
      <h3 id="scoreChartTitle" class="data-section-title">Score Trend (Last 30 Games)</h3>
      <canvas id="scoreChart"></canvas>
    </section>
    <section id="ratingReferenceSection" class="rating-reference" style="display:none;"></section>
    <!-- Period：ゲームの種類ごとの、週・月・年ごとの平均の推移と、今の期間・前の期間の比較（data_period.js の renderStatsPeriod()。Count-Up・01・Cricket で出す） -->
    <section id="periodTrendSection" class="data-summary-section period-trend"></section>
    <section id="heatmapSection" class="data-summary-section stats-wide">
      <h3 class="data-section-title">Heatmap</h3>
      <div class="heatmap-controls">
        <!-- 期間（heatmap.js の setupHeatmapControls()。押しやすいようボタンで並べる） -->
        <span id="heatmapPeriod" class="data-hub-period-tabs heatmap-period-tabs" role="group" aria-label="ヒートマップの期間">
          <button type="button" data-heatmap-period="all">All</button>
          <button type="button" data-heatmap-period="d30">30 Days</button>
          <button type="button" data-heatmap-period="d7">7 Days</button>
          <button type="button" data-heatmap-period="d1">Today</button>
        </span>
        <span id="heatmapCount" class="heatmap-count"></span>
      </div>
      <div class="heatmap-body">
        <div class="heatmap-board">
          <canvas id="heatmapCanvas"></canvas>
        </div>
        <div class="heatmap-side">
          <!-- 中心からの距離（heatmap.js の renderHeatmapRange()） -->
          <div id="heatmapRange" class="heatmap-range"></div>
          <div id="heatmapHits" class="heatmap-hits"></div>
        </div>
      </div>
      <!-- 期間の中の推移（heatmap.js の renderHeatmapTrend()。Today はゲームごと、7 Days・30 Days は日ごと、All は週ごと） -->
      <div class="heatmap-trend">
        <div class="heatmap-trend-top">
          <span class="heatmap-trend-title" id="heatmapTrendTitle">Trend</span>
          <span id="heatmapTrendMetric" class="data-hub-period-tabs" role="group" aria-label="推移の項目">
            <button type="button" data-heatmap-metric="range">RANGE</button>
            <button type="button" data-heatmap-metric="bull">Bull %</button>
            <button type="button" data-heatmap-metric="d80">80% Circle</button>
          </span>
        </div>
        <canvas id="heatmapTrendChart" class="heatmap-trend-chart"></canvas>
        <p id="heatmapTrendNote" class="heatmap-trend-note"></p>
      </div>
    </section>
    <!-- タグ検索：タグを選ぶと、合う日をカレンダーで光らせ、合う日とそれ以外の日の成績を比べる（data.js の renderTagSearch()） -->
    <section class="data-summary-section stats-wide">
      <h3 class="data-section-title">Tag Search</h3>
      <div id="tagSearchSection" class="tag-search"></div>
    </section>
    <section class="data-summary-section stats-wide">
      <h3 class="data-section-title">Tag Scatter</h3>
      <div id="scatterTagControls" class="scatter-tag-controls"></div>
      <canvas id="scatterChart"></canvas>
      <div id="scatterLegend" class="scatter-legend"></div>
    </section>
    <!-- 期間 A と B の比較（data.js の drawSelectedRangeChart()）。ボタンで今週と先週などをすぐ選べ、日付で自由にも選べる -->
    <section id="rangeChartSection" class="data-summary-section stats-wide">
      <div class="range-chart-top">
        <h3 class="data-section-title">Period Compare</h3>
        <span id="rangePresets" class="data-hub-period-tabs range-presets" role="group" aria-label="比べる期間">
          <button type="button" data-range-preset="week">Week</button>
          <button type="button" data-range-preset="month">Month</button>
          <button type="button" data-range-preset="d30">30 Days</button>
        </span>
      </div>
      <div class="range-chart-controls">
        <div class="range-chart-row a">
          <span class="range-prefix">A</span>
          <input id="rangeStartDate" type="date" aria-label="A の始まり" />
          <span class="range-sep">〜</span>
          <input id="rangeEndDate" type="date" aria-label="A の終わり" />
        </div>
        <div class="range-chart-row b">
          <span class="range-prefix">B</span>
          <input id="compareStartDate" type="date" aria-label="B の始まり" />
          <span class="range-sep">〜</span>
          <input id="compareEndDate" type="date" aria-label="B の終わり" />
        </div>
      </div>
      <div id="rangeChartSummary" class="period-trend-compare range-chart-summary"></div>
      <canvas id="rangeScoreChart"></canvas>
      <p class="range-chart-note">それぞれの期間の 1 日目からの日ごとの平均スコア（練習しなかった日は飛ばしてつなぐ）。下の日付は上が A、下が B</p>
    </section>
    <!-- 2 つの日を比べる（data.js の renderDayCompare()。もとの Day の詳細の比較日を作り直したもの） -->
    <section class="data-summary-section stats-wide">
      <h3 class="data-section-title">Day Compare</h3>
      <div id="dayCompareSection" class="day-compare"></div>
    </section>
  </div>
  <!-- フッター：History のページ送り（Stats では出さない） -->
<div class="footer-bar">
  <div class="pagination" id="paginationContainer">
    <button id="prevBtn" onclick="changePage('Prev')">Prev</button>
    <span class="page-info" id="pageInfo"></span>
    <button id="nextBtn" onclick="changePage('Next')">Next</button>
  </div>
</div>
</main>

    <div id="groupNoteModal" class="group-note-modal" style="display:none;">
      <div class="group-note-dialog">
        <div class="group-note-header">
          <h3 id="groupNoteTitle">Group Memo</h3>
          <button id="groupNoteCloseBtn" type="button">×</button>
        </div>

        <label class="group-note-label" for="groupNoteComment">Comment</label>
        <textarea id="groupNoteComment" rows="5" placeholder="その日の調子、設定変更、飲酒有無などをメモ"></textarea>

        <label class="group-note-label" for="groupNoteTags">Tags (comma or space)</label>
        <input id="groupNoteTags" type="text" placeholder="例: 飲酒, 重いバレル, グリップ浅め" />
        <div id="groupNoteTagSuggestions" class="group-note-suggestions" style="display:none;"></div>

        <label class="group-note-label" for="groupNoteImageInput">Setup Image</label>
        <input id="groupNoteImageInput" type="file" accept="image/*" />
        <img id="groupNotePreview" class="group-note-preview-image" alt="preview" style="display:none;" />

        <div class="group-note-actions">
          <button id="groupNoteDeleteImageBtn" type="button">画像削除</button>
          <button id="groupNoteSaveBtn" type="button">保存</button>
        </div>
      </div>
    </div>

    <div id="menuOverlay" class="menu-overlay"></div>

    <!-- ================= MENU DRAWER ================= -->

    <div id="menuEdge" class="menu-edge"></div>

    <!-- サイドメニューの中身は core.js の renderSideMenu() が作る（全画面共通） -->
    <div id="sideMenu" class="side-menu" role="navigation"></div>

    <!-- コア機能（最初に読み込む） -->
    <script src="js/core/state.js" defer></script>
    <script src="js/core/core.js" defer></script>
    <script src="js/core/storage.js" defer></script>

    <!-- 計算（アワード判定） -->
    <script src="js/game/stats.js" defer></script>

    <!-- データ関連 -->
    <script src="js/data/data_loader.js" defer></script>
    <script src="js/data/data_notes.js" defer></script>
    <script src="js/data/rating.js" defer></script>
    <script src="js/data/data.js" defer></script>
    <script src="js/data/heatmap.js" defer></script>
    <script src="js/data/data_01.js" defer></script>
    <script src="js/data/data_cricket.js" defer></script>
    <script src="js/data/data_period.js" defer></script>
    <script src="js/data/data_hub.js" defer></script>

    <!-- 初期化（最後に読み込む） -->
    <script src="js/init/main.js" defer></script>
  </body>
</html>
