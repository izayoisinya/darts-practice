<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Darts Practice</title>

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0,
                maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <meta name="theme-color" content="#0f1115" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta name="apple-mobile-web-app-title" content="Darts Practice" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />

    <link rel="manifest" href="manifest.json" />

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/theme.css" />

    <link rel="stylesheet" href="css/menu.css" />

    <link rel="stylesheet" href="css/layout/lay_core.css" />
  </head>

  <body class="page-menu">
    <header class="header">
      <h1>Darts Practice</h1>
    </header>

    <main class="menu-container">
      <!-- 左列：ゲーム（CountUp / 01 / Cricket を同じ大きさで並べる）と操作 -->
      <div class="menu-col menu-col-main">
      <section class="games-panel">
        <p class="section-label">Games</p>
        <!-- 各ゲームのカード。数字はそのゲームの記録のまとめ（main.js の initMenuSummary()） -->
        <div class="game-list">
          <button type="button" class="game-card game-countup" data-link="countup.html">
            <span class="game-card-head">
              <span class="btn-title">CountUp</span>
              <span class="btn-sub">8 rounds score attack</span>
            </span>
            <span class="hero-metrics" aria-label="CountUp summary">
              <span class="hero-metric">
                <span class="metric-label">Avg Score</span>
                <span class="metric-value" id="menuAvgScore">-</span>
              </span>
              <span class="hero-metric">
                <span class="metric-label">Round Avg</span>
                <span class="metric-value" id="menuRoundAvg">-</span>
              </span>
              <span class="hero-metric">
                <span class="metric-label">Games</span>
                <span class="metric-value" id="menuGamesPlayed">0</span>
              </span>
            </span>
          </button>

          <button type="button" class="game-card game-01" data-link="countup.html?game=01">
            <span class="game-card-head">
              <span class="btn-title">01</span>
              <span class="btn-sub">301 – 1501 finish practice</span>
            </span>
            <span class="hero-metrics" aria-label="01 summary">
              <span class="hero-metric">
                <span class="metric-label">Finish</span>
                <span class="metric-value" id="menu01Rate">-</span>
              </span>
              <span class="hero-metric">
                <span class="metric-label">Avg Darts</span>
                <span class="metric-value" id="menu01Darts">-</span>
              </span>
              <span class="hero-metric">
                <span class="metric-label">Games</span>
                <span class="metric-value" id="menu01Games">0</span>
              </span>
            </span>
          </button>

          <button type="button" class="game-card game-cricket" data-link="countup.html?game=cricket">
            <span class="game-card-head">
              <span class="btn-title">Cricket</span>
              <span class="btn-sub">Close 20 – 15 &amp; Bull</span>
            </span>
            <span class="hero-metrics" aria-label="Cricket summary">
              <span class="hero-metric">
                <span class="metric-label">Avg MPR</span>
                <span class="metric-value" id="menuCricketMpr">-</span>
              </span>
              <span class="hero-metric">
                <span class="metric-label">Close</span>
                <span class="metric-value" id="menuCricketClose">-</span>
              </span>
              <span class="hero-metric">
                <span class="metric-label">Games</span>
                <span class="metric-value" id="menuCricketGames">0</span>
              </span>
            </span>
          </button>
        </div>
      </section>

      <section class="utility-panel">
        <p class="section-label">Utility</p>
        <div class="utility-actions">
          <button onclick="location.href = 'data.html'">Data</button>
          <button onclick="location.href = 'settings.html'">Settings</button>
          <button onclick="location.href = 'news.html'">Info</button>
        </div>
      </section>
      </div>

      <!-- 右列：更新情報とお知らせ -->
      <div class="menu-col menu-col-side">
      <section class="updates-panel">
        <p class="section-label">更新情報</p>
        <ul class="info-list" id="mainUpdatesList" aria-label="更新情報一覧"></ul>
      </section>

      <section class="news-panel">
        <p class="section-label">お知らせ</p>
        <ul class="info-list" id="mainNoticesList" aria-label="お知らせ一覧"></ul>
      </section>
      </div>
    </main>

    <footer class="footer">
      <span>Darts Practice Beta 1</span>
    </footer>

    <!-- コア機能（最初に読み込む） -->
    <script src="js/core/state.js" defer></script>
    <script src="js/core/core.js" defer></script>
    <script src="js/core/storage.js" defer></script>
    <script src="js/ui/news.js" defer></script>

    <!-- 初期化（最後に読み込む） -->
    <script src="js/init/main.js" defer></script>
  </body>
</html>
